<script>
const bankLogos = {

  baac: 'th/baac.png',
  bay: 'th/bay.png',
  bbl: 'th/bbl.png',
  bnp: 'th/bnp.png',
  boa: 'th/boa.png',
  cacib: 'th/cacib.png',
  cimb: 'th/cimb.png',
  citi: 'th/citi.png',
  db: 'th/db.png',

  ghb: 'th/ghb.png',
  gsb: 'th/gsb.png',
  hsbc: 'th/hsbc.png',
  ibank: 'th/ibank.png',
  icbc: 'th/icbc.png',
  jpm: 'th/jpm.png',
  kbank: 'th/kbank.png',
  kk: 'th/kk.png',
  ktb: 'th/ktb.png',

  lhb: 'th/lhb.png',
  mb: 'th/mb.png',
  mega: 'th/mega.png',
  mufg: 'th/mufg.png',
  rbs: 'th/rbs.png',
  sc: 'th/sc.png',
  scb: 'th/scb.png',
  smbc: 'th/smbc.png',
  tbank: 'th/tbank.png',

  tcrb: 'th/tcrb.png',
  tisco: 'th/tisco.png',
  tmb: 'th/tmb.png',
  ttb: 'th/ttb.png',
  uob: 'th/uob.png'
};

/* ====================== */
/* CRC16 */
/* ====================== */

function crc16(s){

  let crc = 0xFFFF;

  for(let i=0;i<s.length;i++){

    crc ^= s.charCodeAt(i) << 8;

    for(let j=0;j<8;j++){

      if(crc & 0x8000){

        crc =
        (crc << 1) ^ 0x1021;

      }else{

        crc <<= 1;
      }

      crc &= 0xFFFF;
    }
  }

  return crc
  .toString(16)
  .toUpperCase()
  .padStart(4,'0');
}

/* ====================== */
/* PAYLOAD */
/* ====================== */

function generatePayload(
  account,
  amount,
  type
){

  account =
  account.replace(/\D/g,'');

  let target = '';

  if(type === 'phone'){

    if(account.startsWith('0')){

      account =
      '66' +
      account.substring(1);
    }

    target =
      '0016A000000677010111' +
      '01130066' +
      account.substring(2);

  }else{

    target =
      '0016A000000677010111' +
      '0213' +
      account;
  }

  let payload =

    '000201' +
    '010211' +

    '29' +
    target.length
    .toString()
    .padStart(2,'0') +

    target +

    '5303764';

  if(amount){

    amount =
    parseFloat(amount)
    .toFixed(2);

    payload +=

      '54' +

      amount.length
      .toString()
      .padStart(2,'0') +

      amount;
  }

  payload +=

    '5802TH' +
    '6304';

  payload += crc16(payload);

  return payload;
}

/* ====================== */
/* GENERATE QR */
/* ====================== */

function generateQR(){

  const type =
  document
  .getElementById('type')
  .value;

  const target =
  document
  .getElementById('target')
  .value;

  const amount =
  document
  .getElementById('amount')
  .value;

  const fullname =
  document
  .getElementById('fullname')
  .value;

  const bank =
  document
  .getElementById('bank')
  .value;

  const bankName =
  document
  .getElementById('bank')
  .options[
    document
    .getElementById('bank')
    .selectedIndex
  ].text;

  if(!target){

    alert('กรุณากรอกข้อมูล');
    return;
  }

  const payload =
  generatePayload(
    target,
    amount,
    type
  );

  document
  .getElementById('bankLogo')
  .src =
  bankLogos[bank];

  document
  .getElementById('bankName')
  .innerText =
  bankName;

  document
  .getElementById('fullNameText')
  .innerText =
  fullname;

  document
  .getElementById('targetText')
  .innerText =
  target;

  document
  .getElementById('amountText')
  .innerText =
  '฿' +
  parseFloat(amount || 0)
  .toLocaleString(
    'th-TH',
    {
      minimumFractionDigits:2
    }
  );

  document
  .getElementById('dateText')
  .innerText =
  new Date()
  .toLocaleString('th-TH');

  const qr =
  document
  .getElementById('qrcode');

  qr.innerHTML = '';

  QRCode.toCanvas(

    payload,

    {
      width:300,
      margin:1
    },

    function(err,canvas){

      if(err){

        alert('QR Error');
        return;
      }

      qr.appendChild(canvas);

      document
      .getElementById('modal')
      .classList
      .add('active');
    }
  );
}

/* ====================== */
/* CLOSE */
/* ====================== */

function closeModal(){

  document
  .getElementById('modal')
  .classList
  .remove('active');
}

/* ====================== */
/* DOWNLOAD */
/* ====================== */

function downloadQR(){

  const canvas =
  document.querySelector(
    '#qrcode canvas'
  );

  if(!canvas) return;

  const link =
  document.createElement('a');

  link.download =
  'promptpay-slip.png';

  link.href =
  canvas.toDataURL(
    'image/png'
  );

  link.click();
}

/* ====================== */
/* CLICK BG CLOSE */
/* ====================== */

document
.getElementById('modal')
.addEventListener(
  'click',
  function(e){

    if(
      e.target.id ===
      'modal'
    ){

      closeModal();
    }
  }
);

const typeSelect =
document.getElementById('type');

const targetInput =
document.getElementById('target');

/* ====================== */
/* CHANGE TYPE */
/* ====================== */

typeSelect.addEventListener(
  'change',
  function(){

    if(this.value === 'phone'){

      targetInput.placeholder =
      '080-123-4567';

      targetInput.maxLength = 10;

      targetInput.value = '';

    }else{

      targetInput.placeholder =
      '1-2345-67890-12-3';

      targetInput.maxLength = 13;

      targetInput.value = '';
    }
  }
);

/* ====================== */
/* NUMBER ONLY */
/* ====================== */

targetInput.addEventListener(
  'input',
  function(){

    this.value =
    this.value.replace(/\D/g,'');
  }
);

</script>
